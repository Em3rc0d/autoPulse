name: AutoPulse Android APK

on:
  pull_request:
    paths:
      - 'mobile-app/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: mobile-app
        run: npm ci

      - name: Verify TypeScript and tests
        working-directory: mobile-app
        run: npm run verify

      - name: Build debug APK
        working-directory: mobile-app/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Prepare APK artifact
        run: |
          mkdir -p dist
          cp mobile-app/android/app/build/outputs/apk/debug/app-debug.apk dist/AutoPulse-internal.apk
          sha256sum dist/AutoPulse-internal.apk | tee dist/AutoPulse-internal.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AutoPulse-internal-android
          path: |
            dist/AutoPulse-internal.apk
            dist/AutoPulse-internal.apk.sha256
          if-no-files-found: error
          retention-days: 14
