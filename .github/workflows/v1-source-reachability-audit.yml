name: AutoPulse V1 Source Reachability Audit

on:
  push:
    branches:
      - chore/v1-permission-surface-cleanup
    paths:
      - '.github/workflows/v1-source-reachability-audit.yml'

permissions:
  contents: read

jobs:
  reachability:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/v1-permission-surface-cleanup
          persist-credentials: false

      - name: Capture source reachability
        run: |
          set -euo pipefail
          mkdir -p .release
          {
            echo '## expo-file-system / FileSystem'
            grep -RInE "expo-file-system|FileSystem" mobile-app/src mobile-app/App.tsx || true
            echo
            echo '## expo-av / Audio'
            grep -RInE "expo-av|Audio\." mobile-app/src mobile-app/App.tsx || true
            echo
            echo '## foreground service'
            grep -RInE "rn-foreground-service|ReactNativeForegroundService" mobile-app/src mobile-app/App.tsx || true
            echo
            echo '## expo-location'
            grep -RInE "expo-location|Location\." mobile-app/src mobile-app/App.tsx || true
          } | tee .release/v1-source-reachability.txt

      - name: Upload reachability evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: autopulse-v1-source-reachability
          path: .release/v1-source-reachability.txt
          if-no-files-found: error
          retention-days: 14
