name: AutoPulse Android APK Internal

on:
  push:
    branches:
      - build/apk-chatgpt-20260821
    paths:
      - 'mobile-app/**'
      - '.github/workflows/android-apk-internal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Use Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript and tests
        run: npm run verify

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Build standalone internal APK
        working-directory: mobile-app/android
        env:
          NODE_ENV: production
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify React Native bundle is packaged
        working-directory: mobile-app
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -Eq 'assets/(index\.android\.bundle|expo-root\.js|.*\.bundle)' || {
            echo "ERROR: standalone JS bundle is missing from $APK"
            unzip -l "$APK" | grep 'assets/' | head -200 || true
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: autopulse-android-internal-apk
          path: mobile-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
