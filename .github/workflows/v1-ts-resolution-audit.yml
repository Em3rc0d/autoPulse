name: Inspect V1 TypeScript Module Resolution

on:
  push:
    branches:
      - feat/v1-product-closure
    paths:
      - '.github/workflows/v1-ts-resolution-audit.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/v1-product-closure
          persist-credentials: false
      - name: Use Node.js 22 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - name: Install exact dependencies
        working-directory: mobile-app
        run: npm ci
      - name: Locate expo-crypto declarations and TypeScript resolution
        working-directory: mobile-app
        run: |
          set -euo pipefail
          echo '--- npm ls expo-crypto ---'
          npm ls expo-crypto || true
          echo '--- repository ambient declarations ---'
          grep -RInE "declare module ['\"]expo-crypto|module ['\"]expo-crypto" . --exclude-dir=node_modules --exclude-dir=android --exclude-dir=ios || true
          echo '--- TypeScript trace excerpts ---'
          npx tsc --noEmit --traceResolution 2>&1 | grep -E -B 12 -A 24 "expo-crypto|Crypto\.d\.ts|Crypto\.types" | head -400 || true
