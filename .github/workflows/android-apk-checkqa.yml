name: AutoPulse Android Check QA APK

on:
  pull_request:
    branches:
      - main
    paths:
      - 'mobile-app/**'
      - '.github/workflows/android-apk-checkqa.yml'

permissions:
  contents: read

jobs:
  build-checkqa:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Use Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript and tests
        run: npm run verify

      - name: Build side-by-side Check QA APK
        working-directory: mobile-app/android
        env:
          NODE_ENV: production
        run: |
          chmod +x gradlew
          ./gradlew assembleCheckqa --no-daemon --console=plain

      - name: Verify Check QA package, bundle, permissions and signature
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/checkqa -type f -name '*.apk' | sort | head -1)"
          test -n "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -Eq 'assets/(index\.android\.bundle|expo-root\.js|.*\.bundle)'

          AAPT2="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt2 | sort -V | tail -1)"
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          mkdir -p .release/checkqa
          "$AAPT2" dump badging "$APK" | tee .release/checkqa/apk-badging.txt
          "$AAPT2" dump permissions "$APK" | tee .release/checkqa/apk-effective-permissions.txt
          "$APKSIGNER" verify --verbose --print-certs "$APK" | tee .release/checkqa/apksigner-verification.txt

          grep -q "package: name='com.em3rc0dth.autopulse.checkqa'" .release/checkqa/apk-badging.txt
          grep -q "com.em3rc0dth.autopulse.checkqa.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION" .release/checkqa/apk-effective-permissions.txt

          cp "$APK" .release/checkqa/AutoPulse-CHECK-MK9-CheckQA.apk
          sha256sum .release/checkqa/AutoPulse-CHECK-MK9-CheckQA.apk | tee .release/checkqa/apk.sha256

      - name: Generate Check QA receipt
        env:
          AP_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          AP_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          AP_CI_SHA: ${{ github.sha }}
          AP_PR_NUMBER: ${{ github.event.pull_request.number }}
          AP_RUN_ID: ${{ github.run_id }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const path = '.release/checkqa/AutoPulse-CHECK-MK9-CheckQA.apk';
          const crypto = require('crypto');
          const bytes = fs.readFileSync(path);
          const receipt = {
            schema: 'autopulse.checkqa-artifact-receipt/v1',
            source: {
              repository: process.env.GITHUB_REPOSITORY,
              pullRequest: Number(process.env.AP_PR_NUMBER),
              checkCoreSourceSha: '8202d173ed97a016e16dd2c251b09c9a4b45acaa',
              buildBranchHeadSha: process.env.AP_HEAD_SHA,
              baseSha: process.env.AP_BASE_SHA,
              ciTestedSha: process.env.AP_CI_SHA,
              workflowRunId: Number(process.env.AP_RUN_ID),
            },
            build: {
              variant: 'checkqa',
              applicationId: 'com.em3rc0dth.autopulse.checkqa',
              installAlongsideProduction: true,
              signingClass: 'ANDROID_DEBUG',
              publicReleaseEligible: false,
            },
            artifact: {
              file: 'AutoPulse-CHECK-MK9-CheckQA.apk',
              sha256: crypto.createHash('sha256').update(bytes).digest('hex'),
              sizeBytes: bytes.length,
            },
          };
          fs.writeFileSync('.release/checkqa/autopulse-checkqa-receipt.json', JSON.stringify(receipt, null, 2) + '\n');
          NODE
          cat .release/checkqa/autopulse-checkqa-receipt.json

      - name: Upload side-by-side Check QA APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: autopulse-checkqa-installable-apk
          path: |
            mobile-app/.release/checkqa/AutoPulse-CHECK-MK9-CheckQA.apk
            mobile-app/.release/checkqa/autopulse-checkqa-receipt.json
            mobile-app/.release/checkqa/apk-badging.txt
            mobile-app/.release/checkqa/apk-effective-permissions.txt
            mobile-app/.release/checkqa/apksigner-verification.txt
            mobile-app/.release/checkqa/apk.sha256
          if-no-files-found: error
          retention-days: 14
