name: Refresh V1 Product Closure Lockfile

on:
  push:
    branches:
      - feat/v1-product-closure
    paths:
      - '.github/workflows/v1-refresh-lockfile.yml'
      - 'mobile-app/package.json'

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: feat/v1-product-closure
      - name: Use Node.js 22 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json
      - name: Regenerate package lock deterministically
        working-directory: mobile-app
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify clean install from regenerated lock
        working-directory: mobile-app
        run: npm ci
      - name: Commit lockfile if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- mobile-app/package-lock.json; then
            echo 'package-lock.json already consistent'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile-app/package-lock.json
          git commit -m 'chore(v1): refresh product closure lockfile'
          git push origin HEAD:feat/v1-product-closure
