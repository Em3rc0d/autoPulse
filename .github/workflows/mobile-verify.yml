name: AutoPulse Mobile Verify

on:
  pull_request:
    paths:
      - 'mobile-app/**'
      - '.github/workflows/mobile-verify.yml'
  push:
    branches:
      - main
    paths:
      - 'mobile-app/**'
      - '.github/workflows/mobile-verify.yml'

permissions:
  contents: read

jobs:
  verify-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      # @testing-library/react-native requires react-test-renderer matching React.
      # The legacy lockfile does not currently declare that peer. Keep product
      # dependency installation reproducible via npm ci, then hydrate this
      # pinned test-only peer without mutating package.json/package-lock.json.
      # R9 tracks proper dependency/lockfile reconciliation before RC.
      - name: Hydrate React Native test renderer
        run: npm install --no-save --package-lock=false --ignore-scripts react-test-renderer@18.2.0

      - name: Verify TypeScript and tests
        run: npm run verify
