name: AutoPulse Mobile Verify

on:
  pull_request:
    paths:
      - 'mobile-app/**'
      - '.github/workflows/mobile-verify.yml'
  push:
    branches:
      - main
    paths:
      - 'mobile-app/**'
      - '.github/workflows/mobile-verify.yml'

permissions:
  contents: read

jobs:
  verify-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify TypeScript and tests
        run: npm run verify
