name: AutoPulse Android Native Verify — No APK

on:
  pull_request:
    branches:
      - fix/release-obd-ble-hardening-20261015
    paths:
      - 'mobile-app/android/**'
      - 'mobile-app/package.json'
      - 'mobile-app/package-lock.json'
      - '.github/workflows/android-native-verify.yml'

permissions:
  contents: read

concurrency:
  group: autopulse-native-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-kotlin:
    name: Compile Android Kotlin only — no APK, no artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile-app

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use Node.js 22 LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Use Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Install pinned JS/native Gradle dependencies
        run: npm ci --no-audit --no-fund

      - name: Compile ONLY Android Kotlin sources (no assembly/bundle)
        working-directory: mobile-app/android
        env:
          NODE_ENV: development
          AUTOPULSE_INTERNAL_RELEASE: 'true'
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          # Debug React-Android AAR Jetifier needs more than the project's
          # default 2 GiB Gradle heap on a cold GitHub runner.
          # Constrain workers and keep Kotlin compiler in-process to bound RSS.
          ./gradlew :app:compileDebugKotlin --no-daemon --console=plain --max-workers=1 \
            '-Dorg.gradle.jvmargs=-Xmx4608m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8' \
            -Pkotlin.compiler.execution.strategy=in-process

      - name: Assert Kotlin class exists and APK/AAB were not produced
        run: |
          set -euo pipefail
          find android/app/build -type f -name 'AutoPulseVoiceModule.class' -print | grep -q 'AutoPulseVoiceModule.class' || {
            echo 'ERROR: native voice Kotlin class was not compiled'
            exit 1
          }
          if find android -type f \( -name '*.apk' -o -name '*.aab' \) -print | grep -q .; then
            echo 'ERROR: forbidden APK/AAB produced in the native-only verification gate'
            exit 1
          fi
          echo 'PASS: native Kotlin compiled. No APK, no AAB, no uploaded artifacts.'
